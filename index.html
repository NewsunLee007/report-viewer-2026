    if(fragmentKey) sessionStorage.setItem("report-viewer-key",fragmentKey);
    const keyText=fragmentKey||sessionStorage.getItem("report-viewer-key");
    if(keyText){
      document.getElementById("loading").style.display="block";
      document.getElementById("message").textContent="";
      (async()=>{
        try{
          const key=await crypto.subtle.importKey("raw",decode(keyText),{name:"AES-GCM"},false,["decrypt"]);
          const decrypted=await crypto.subtle.decrypt({name:"AES-GCM",iv:decode(ivText),tagLength:128},key,decode(encryptedPayload));
          const html=new TextDecoder().decode(decrypted);
          document.open();document.write(html);document.close();
        }catch(error){
          sessionStorage.removeItem("report-viewer-key");
          document.getElementById("loading").style.display="none";
          document.getElementById("error").style.display="block";
        }
      })();
    }
  </script>
</body>
