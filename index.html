      document.getElementById("loading").style.display="block";
      document.getElementById("message").textContent="";
      (async()=>{
        try{
          const key=await crypto.subtle.importKey("raw",decode(keyText),{name:"AES-GCM"},false,["decrypt"]);
          const decrypted=await crypto.subtle.decrypt({name:"AES-GCM",iv:decode(ivText),tagLength:128},key,decode(encryptedPayload));
          const html=new TextDecoder().decode(decrypted);
          const parsed=new DOMParser().parseFromString(html,"text/html");
          const frame=document.createElement("iframe");
          frame.className="report-frame";
          frame.title=parsed.title||"Report";
          frame.srcdoc=html;
          document.title=parsed.title||document.title;
          document.body.replaceChildren(frame);
        }catch(error){
          sessionStorage.removeItem("report-viewer-key");
          document.getElementById("loading").style.display="none";
          document.getElementById("error").style.display="block";
        }
      })();
    }
  </script>
</body>
</html>
